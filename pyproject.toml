[project]
name = "my-scraper"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.3",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.4",
    "scrapegraphai>=2.3.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
my-scraper = "my_scraper:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
